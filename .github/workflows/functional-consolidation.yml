name: Functional consolidation validation

on:
  pull_request:

permissions:
  contents: read

jobs:
  focused:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Prepare config
        run: |
          cp tool/config.example.json tool/config.json
          python - <<'PY'
          import json
          from pathlib import Path
          path = Path("tool/config.json")
          config = json.loads(path.read_text(encoding="utf-8"))
          config["filesystem"]["root"] = "/tmp/webcap-fs"
          config["filesystem"]["models"] = "/tmp/webcap-models"
          path.write_text(json.dumps(config, indent=2) + "\n", encoding="utf-8")
          Path("/tmp/webcap-fs").mkdir(parents=True, exist_ok=True)
          Path("/tmp/webcap-models").mkdir(parents=True, exist_ok=True)
          PY
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install pytest
          python -m pip install -r requirements.txt
      - name: Run focused Python tests
        run: |
          python -m pytest -q \
            tests/test_test_models.py \
            tests/test_generate_route.py::test_generate_capabilities_publishes_portable_lora_names \
            tests/test_generate_ui_contract.py::test_generate_tracks_terminal_jobs_and_preserves_queue_dom_identity \
            tests/test_generate_ui_contract.py::test_generate_errors_keep_detail_in_console_and_use_concise_setup_badge \
            tests/test_training_workspace_scope_ui_contract.py::test_training_presentation_is_owned_by_training_surface \
            tests/test_execution_queue.py::test_execution_queue_startup_reconciliation_precedes_monitors \
            tests/test_training_stabilization.py::test_training_startup_reconciliation_claims_gpu_for_live_training \
            tests/test_inference_runner.py::test_inference_restart_records_unresolved_provider_without_contacting_comfyui \
            tests/test_inference_runner.py::test_inference_monitor_does_not_poll_comfyui_for_pending_cleanup \
            tests/test_inference_runner.py::test_inference_resume_checks_pending_cleanup_once
      - name: Check JavaScript syntax
        run: find tool/js -type f -name '*.js' -print0 | xargs -0 -n1 node --check
