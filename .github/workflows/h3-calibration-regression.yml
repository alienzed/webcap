name: H3 calibration regression
on:
  pull_request:
    paths:
      - 'tool/server/h3_probe.py'
      - 'tool/server/training_profiles.py'
      - 'tool/server/training_config_files.py'
      - 'tool/server/training_bundle.py'
      - 'tool/js/training_review.js'
      - 'tool/js/training_history_ui.js'
      - 'tool/server/training_history.py'
      - 'tests/test_training_history_unlink.py'
      - 'tests/test_training_history_ui_contract.py'
      - 'tests/test_training_resume_discovery.py'
      - 'tool/js/training_runner_ui.js'
      - 'tool/js/training_workspace.js'
      - 'tool/server/training_runner.py'
      - 'tool/server/app.py'
      - 'tests/test_training_review_ui_contract.py'
      - 'tool/tool.html'
      - 'tests/test_training_stabilization.py'
      - 'tests/test_h3_probe.py'
      - 'tests/test_training_review_ui_contract.py'
      - '.github/workflows/h3-calibration-regression.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  image-shift-settings:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: cp tool/config.example.json tool/config.json
      - run: python -m pip install pytest Flask Pillow Werkzeug imageio websocket-client opencv-python-headless
      - run: node --check tool/js/training_review.js
      - run: python -m pytest -q tests/test_training_stabilization.py -k 'h3_image_shift_uses_existing_template_and_validates_values'
      - name: Resume Image Adapter and History unlink regression
        run: |
          node --check tool/js/training_review.js
          node --check tool/js/training_history_ui.js
          node --check tool/js/training_runner_ui.js
          python -m pytest -q tests/test_training_history_unlink.py tests/test_training_history_ui_contract.py tests/test_training_resume_discovery.py
          python -m pytest -q tests/test_training_stabilization.py -k 'h3_checkpoint_resume_rejects_switching_image_adapter'
      - run: python -m pytest -q tests/test_training_review_ui_contract.py -k 'h3_image_shift_run_setup_validation or run_setup_uses_compact_parameter_rail_and_resume_canvas or run_setup_summary_omits_unused_video_targets_without_changing_plan'
  training-queue-edit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: cp tool/config.example.json tool/config.json
      - run: python -m pip install pytest Flask Pillow Werkzeug imageio websocket-client opencv-python-headless
      - run: node --check tool/js/training_runner_ui.js && node --check tool/js/training_workspace.js
      - run: python -m pytest -q tests/test_training_stabilization.py -k 'update_queued_epochs or training_queue_reorder_position'
      - run: python -m pytest -q tests/test_training_review_ui_contract.py -k 'training_queue_has_direct_reorder_and_epoch_controls'
  calibration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
      - run: cp tool/config.example.json tool/config.json
      - run: python -m pip install pytest Flask Pillow Werkzeug imageio websocket-client opencv-python-headless
      - run: python -m compileall -q tool/server/h3_probe.py tool/server/training_profiles.py
      - name: Focused H3 LoRA targeting and run capture
        run: |
          node --check tool/js/training_review.js
          python -m pytest -q tests/test_training_stabilization.py -k 'h3_focused or h3_image_shift'
          python -m pytest -q tests/test_training_review_ui_contract.py -k 'h3_image_shift_run_setup_validation or run_setup_uses_compact_parameter_rail_and_resume_canvas or run_setup_summary_omits_unused_video_targets_without_changing_plan'
      - name: H3 calibration preparation and probe regression
        run: python -m pytest -q tests/test_h3_probe.py tests/test_training_profiles.py
