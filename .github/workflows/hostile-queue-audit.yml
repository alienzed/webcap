name: Hostile queue audit

on:
  push:
    branches:
      - hostile-audit-queue

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --upgrade pip
      - run: pip install -r requirements.txt pytest
      - run: cp tool/config.example.json tool/config.json
      - run: python -m py_compile tool/server/training_runner.py tool/server/epoch_test_bench.py
      - run: node --check tool/js/training_runner_ui.js
      - run: node --check tool/js/training_workspace.js
      - run: node --check tool/js/training_workspace_state.js
      - run: node --check tool/js/training_history_ui.js
      - run: node --check tool/js/test_generations.js
      - run: >
          PYTHONPATH=. pytest -q
          tests/test_epoch_test_bench.py
          tests/test_test_generations_ui_contract.py
          tests/test_training_stabilization.py
          -k "queued_candidate_snapshot or remove_candidate_refuses_when_queued_test_references_it or direct_test_start_operation_is_removed or prepare_then_start_from_session_folder_reuses_same_staged_loras or run_batch_marks_session_failed_when_template_load_fails or epoch_test_bench_does_not_import_training_runner_at_module_load or queued_request_freezes_prompt_seed_and_selected_files or enqueue_test_delegates_to_shared_queue or test_generations_queue_contract or shared_queue or queued_test_positions_follow_the_unified_queue or test_candidate_dependency_lookup_is_scoped_to_folder_and_active_state or future_training_does_not_pause_tests_ahead_of_it or external_gpu_reservation_fossil_is_removed"
