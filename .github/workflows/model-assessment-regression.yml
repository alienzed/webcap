name: Model Assessment regression

on:
  pull_request:
    paths:
      - 'tool/server/model_lab.py'
      - 'tool/server/model_lab_quality.py'
      - 'tool/server/llm_runner.py'
      - 'tool/js/model_lab.js'
      - 'tool/js/diagnostics.js'
      - 'tool/css/modals.css'
      - 'tool/tool.html'
      - 'tests/model_assessment_preview_ui.test.js'
      - 'tests/model_assessment_speed_ui.test.cjs'
      - 'tests/model_assessment_scene_response_ui.test.cjs'
      - 'tool/js/progress_card.js'
      - 'tests/test_model_lab.py'
      - 'tests/model_assessment_preview_ui.test.js'
      - 'tests/test_model_assessment_completion.py'
      - 'tests/test_assessment_transfer.py'
      - 'tests/test_director_model_calibration.py'
      - 'tests/test_model_assessment_thinking_unified.py'
      - '.github/workflows/model-assessment-regression.yml'
  push:
    paths:
      - 'tool/server/model_lab.py'
      - 'tool/server/model_lab_quality.py'
      - 'tool/server/llm_runner.py'
      - 'tool/js/model_lab.js'
      - 'tool/js/diagnostics.js'
      - 'tool/js/progress_card.js'
      - 'tests/test_model_lab.py'
      - 'tests/model_assessment_preview_ui.test.js'
      - 'tests/test_model_assessment_completion.py'
      - 'tests/test_assessment_transfer.py'
      - 'tests/test_director_model_calibration.py'
      - 'tests/test_model_assessment_thinking_unified.py'
      - '.github/workflows/model-assessment-regression.yml'

jobs:
  assessment:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install focused test dependencies
        run: python -m pip install pytest Flask Pillow Werkzeug imageio websocket-client opencv-python-headless
      - name: Prepare test configuration
        run: cp tool/config.example.json tool/config.json
      - name: Assessment and integration tests
        run: python -m pytest -q tests/test_model_lab.py tests/test_model_assessment_thinking_unified.py tests/test_model_assessment_completion.py tests/test_assessment_transfer.py tests/test_director_model_calibration.py
      - name: Historical Director cache Storage Manager integration
        run: python -m pytest -q tests/test_storage_manager.py -k director_assessment
      - name: Ask VL and Describe VL output and failure contracts
        run: |
          python -m pytest -q tests/test_caption_vision.py tests/test_llm_runner.py tests/test_storyboard_llm_runtime.py tests/test_director_thinking_mvp.py -k "only_ask_and_describe_vl_skip_configured_output_cap or empty_provider_completion or remote_vl_can_omit_configured_output_cap or standalone_vision_caption_route_queues_plain_multimodal_caption_job or ask_vision_route_queues_direct_question_on_existing_multimodal_lane"
      - name: Progress Card snapshot and Diagnostics JavaScript
        run: |
          node --check tool/js/model_lab.js
          node --check tool/js/diagnostics.js
          node --check tool/js/progress_card.js
          node tests/test_model_lab_progress.js
          node --test tests/model_assessment_preview_ui.test.js tests/model_assessment_speed_ui.test.cjs tests/model_assessment_scene_response_ui.test.cjs
          node --test tests/model_assessment_preview_ui.test.js
