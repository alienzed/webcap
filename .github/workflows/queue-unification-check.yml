name: Queue unification check

on:
  push:
    branches:
      - queue-unification-work

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --upgrade pip
      - run: pip install -r requirements.txt pytest
      - run: pytest -q tests/test_epoch_test_bench.py tests/test_test_generations_ui_contract.py tests/test_training_stabilization.py tests/test_training_workspace_scope_ui_contract.py
