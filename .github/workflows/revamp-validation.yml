name: Test Generations parity validation
on:
  pull_request:
    paths:
      - 'tool/tool.html'
      - 'tool/js/test_generations*.js'
      - 'tool/js/epoch_finder.js'
      - 'tool/server/epoch_finder.py'
      - 'tool/server/epoch_test_bench.py'
      - 'tool/css/styles.css'
      - 'tests/test_generations_unified_dom.test.cjs'
      - 'tests/test_test_generations_unified_*.py'
      - 'tests/test_test_generations_ui_contract.py'
      - '.github/workflows/revamp-validation.yml'
  push:
    branches:
      - main
    paths:
      - 'tool/**'
      - 'tests/**'
      - '.github/workflows/revamp-validation.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: JavaScript syntax
        run: |
          node --check tool/js/test_generations_unified.js
          node --check tool/js/test_generations_perspective.js
          node --check tool/js/epoch_finder.js
          node --check tool/js/test_generations.js
      - name: Install DOM test dependency
        run: npm install --no-save --no-package-lock jsdom
      - name: Browser DOM lifecycle smoke
        run: node --test tests/test_generations_unified_dom.test.cjs
      - name: Python syntax
        run: python -m compileall -q tool/server/epoch_finder.py tool/server/epoch_test_bench.py tests/test_test_generations_unified_gallery.py
      - name: Prepare isolated config
        run: cp tool/config.example.json tool/config.json
      - name: Install test essentials
        run: python -m pip install pytest Flask Pillow Werkzeug imageio websocket-client opencv-python-headless
      - name: Recovered Evaluate All behavior
        run: node --test tests/test_generations_evaluate_all.test.cjs
      - name: Recovery Python syntax and focused behavior
        run: |
          python -m compileall -q tool/server/training_runner.py tool/server/storyboard_store.py tool/server/execution_queue.py
          python -m pytest -q tests/test_training_continue_epoch_extension.py
          python -m pytest -q tests/test_execution_queue.py -k reorders_mixed_inference_client_jobs
          python -m pytest -q tests/test_training_stabilization.py -k training_queue_reorder_position_preserves_nonqueued_slots
          python -m pytest -q tests/test_storyboard_store.py -k concept_restore_keeps_initial_prompt_as_fixed_baseline
      - name: Unified gallery and no-feature-loss contracts
        run: python -m pytest -q tests/test_test_generations_unified_gallery.py tests/test_test_generations_unified_workspace.py tests/test_test_generations_revamp_parity.py tests/test_test_generations_perspective.py
      - name: Current native Test and Repeat contracts (must pass)
        run: |
          python -m pytest -q tests/test_test_generations_focused_unification.py tests/test_test_repeat.py tests/test_test_workspace_permanent_tabs.py tests/test_test_generations_revamp_parity.py
      - name: Legacy regression comparison (no new failures)
        run: |
          git fetch origin main
          git worktree add /tmp/webcap-revamp-baseline origin/main
          cp tool/config.example.json /tmp/webcap-revamp-baseline/tool/config.json
          set +e
          python -m pytest -q --tb=no tests/test_test_generations_ui_contract.py tests/test_test_generations_route.py tests/test_test_generations_ask_vl_navigation_contract.py tests/test_epoch_finder.py tests/test_epoch_finder_multirun.py tests/test_run_analytics_next.py > /tmp/feature-test-results.txt 2>&1
          (cd /tmp/webcap-revamp-baseline && python -m pytest -q --tb=no tests/test_test_generations_ui_contract.py tests/test_test_generations_route.py tests/test_test_generations_ask_vl_navigation_contract.py tests/test_epoch_finder.py tests/test_epoch_finder_multirun.py tests/test_run_analytics_next.py) > /tmp/baseline-test-results.txt 2>&1
          set -e
          tail -n 12 /tmp/feature-test-results.txt
          python tests/compare_revamp_regressions.py /tmp/baseline-test-results.txt /tmp/feature-test-results.txt
