name: Evaluation parity validation
on:
  pull_request:
    paths:
      - 'tool/tool.html'
      - 'tool/js/lora_library_ui.js'
      - 'tool/css/lora_library.css'
      - 'tests/lora_library_ui.test.cjs'
      - 'tool/js/set_scan.js'
      - 'tool/js/caption_vision.js'
      - 'tool/js/media_context_actions.js'
      - 'tests/test_vl_workspace_unified.py'
      - 'tests/vl_workspace_tabs.test.cjs'
      - 'tests/vl_workspace_navigation.test.cjs'
      - 'tests/test_media_context_actions_contract.py'
      - 'tool/js/primer_settings.js'
      - 'tool/js/item_details.js'
      - 'tool/js/checklist_state.js'
      - 'tool/js/media.js'
      - 'tool/js/constants.js'
      - 'tool/js/folder_state.js'
      - 'tool/js/main.js'
      - 'tool/js/ui.js'
      - 'tool/server/smart_set.py'
      - 'tests/test_folder_state_ui_contract.py'
      - 'tests/test_file_ops_routes.py'
      - 'tool/js/media_grid_state.js'
      - 'tool/js/media_grid_actions.js'
      - 'tests/tag_mismatch_filter.test.cjs'
      - 'tests/media_filter_efficiency.test.cjs'
      - 'tests/qa_incomplete_health_retention.test.cjs'
      - 'tool/js/caption_enrichment.js'
      - 'tests/caption_enrichment.test.cjs'
      - 'tests/test_caption_enrichment.py'
      - 'tests/caption_assist_typing_performance.test.cjs'
      - 'tests/caption_assist_opening_sight.test.cjs'
      - 'tests/caption_assist_tag_mismatch.test.cjs'
      - 'tool/js/generate.js'
      - 'tests/generations_form_preservation.test.cjs'
      - 'tests/generations_editor_tabs.test.cjs'
      - 'tool/js/sight_group_suggestions.js'
      - 'tool/js/focused_annotation.js'
      - 'tests/sight_group_suggestions.test.cjs'
      - 'tests/focused_annotation_integration.test.js'
      - 'tool/server/vision_schema_assist.py'
      - 'tool/server/media.py'
      - 'tool/server/caption_ops.py'
      - 'tool/css/modals.css'
      - 'tests/test_vision_schema_assist.py'
      - 'tests/test_vision_schema_route.py'
      - 'tests/test_set_scan_ui_contract.py'
      - 'tests/test_caption_atomic.py'
      - 'tests/test_caption_assist_reuse_contract.py'
      - 'tool/js/qa_workbench.js'
      - 'tool/js/qa_curation.js'
      - 'tool/server/qa_curation.py'
      - 'tool/server/llm_runner.py'
      - 'tool/server/app.py'
      - 'tool/css/qa_workbench.css'
      - 'tool/js/smart_set.js'
      - 'tests/test_qa_curation.py'
      - 'tests/qa_curation_ui.test.cjs'
      - 'tool/js/test_generations*.js'
      - 'tool/js/job_queues.js'
      - 'tool/js/training_runner_ui.js'
      - 'tool/js/training_review.js'
      - 'tool/js/training_history_ui.js'
      - 'tool/server/training_history.py'
      - 'tool/server/training_runner.py'
      - 'tests/test_training_history_unlink.py'
      - 'tests/test_training_history_ui_contract.py'
      - 'tests/test_training_resume_discovery.py'
      - 'tests/test_training_stabilization.py'
      - 'tool/css/workbench.css'
      - 'tests/training_queue_epoch_icons.test.cjs'
      - 'tool/css/workspace_shell.css'
      - 'tests/job_queue_drag_reorder.test.cjs'
      - 'tool/js/epoch_finder.js'
      - 'tool/server/epoch_finder.py'
      - 'tool/server/epoch_reference.py'
      - 'tool/server/training_reference_selections.py'
      - 'tests/test_training_reference_selections.py'
      - 'tests/test_training_references_browser.py'
      - 'tests/test_epoch_finder_multigroup_references.py'
      - 'tool/js/test_references.js'
      - 'tool/css/epoch_finder.css'
      - 'tool/server/epoch_test_bench.py'
      - 'tool/css/styles.css'
      - 'tests/test_generations_unified_dom.test.cjs'
      - 'tests/test_test_generations_unified_*.py'
      - 'tests/test_test_generations_ui_contract.py'
      - 'tests/test_test_generations_route.py'
      - 'tests/test_test_generations_ask_vl_navigation_contract.py'
      - 'tests/test_test_repeat.py'
      - 'tests/test_epoch_finder.py'
      - 'tests/test_epoch_finder_scaling.py'
      - 'tests/test_epoch_finder_scaling_dom.test.cjs'
      - 'tests/epoch_finder_compact_header.test.cjs'
      - 'tests/epoch_screening_round_cards.test.cjs'
      - 'tests/test_epoch_finder_multirun.py'
      - 'tests/test_run_analytics_next.py'
      - 'tool/js/epoch_info.js'
      - 'tool/js/run_analytics.js'
      - 'tests/test_insights_sidebar_navigation.test.cjs'
      - '.github/workflows/revamp-validation.yml'
  push:
    branches:
      - main
    paths:
      - 'tool/**'
      - 'tests/**'
      - '.github/workflows/revamp-validation.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: JavaScript syntax
        run: |
          node --check tool/js/epoch_finder.js
          node --check tool/js/lora_library_ui.js
          node --check tool/js/qa_curation.js
          node --check tool/js/test_generations.js
          node --check tool/js/run_analytics.js
          node --check tool/js/workspace_shell.js
          node --check tool/js/set_vl_clone.js
          node --check tool/js/media_context_actions.js
          node --test tests/vl_workspace_tabs.test.cjs
          node --test tests/vl_workspace_navigation.test.cjs
          node --check tool/js/set_scan.js
          node --check tool/js/caption_vision.js
          node --check tool/js/media_context_actions.js
          node --check tool/js/primer_settings.js
          node --check tool/js/caption_enrichment.js
          node --test tests/caption_enrichment.test.cjs
          node --check tool/js/generate.js
          node --test tests/generations_form_preservation.test.cjs
          node --test tests/generations_editor_tabs.test.cjs
          node --check tool/js/sight_group_suggestions.js
          node --check tool/js/focused_annotation.js
          node --test tests/sight_group_suggestions.test.cjs
          node tests/focused_annotation_integration.test.js
      - name: Install DOM test dependency
        run: npm install --no-save --no-package-lock jsdom
      - name: Evaluation DOM ownership and navigation smoke
        run: |
          node --test tests/test_generations_unified_dom.test.cjs
          node --test tests/lora_library_ui.test.cjs
          node --test tests/test_test_surface_context_navigation.test.cjs
          node --test tests/test_epoch_finder_scaling_dom.test.cjs
          node --test tests/epoch_finder_compact_header.test.cjs
          node --test tests/epoch_screening_round_cards.test.cjs
          node --test tests/qa_curation_ui.test.cjs
          node --test tests/caption_assist_typing_performance.test.cjs
          node --test tests/caption_assist_opening_sight.test.cjs
      - name: Inference and Training drag-to-reorder
        run: |
          node --check tool/js/job_queues.js
          node --test tests/job_queue_drag_reorder.test.cjs
      - name: Queued epoch editor icon contract
        run: |
          node --check tool/js/training_runner_ui.js
          node --test tests/training_queue_epoch_icons.test.cjs
      - name: Python syntax
        run: python -m compileall -q tool/server/epoch_finder.py tool/server/epoch_test_bench.py tests/test_test_generations_unified_gallery.py
      - name: Prepare isolated config
        run: cp tool/config.example.json tool/config.json
      - name: Install test essentials
        run: python -m pip install pytest Flask Pillow Werkzeug imageio websocket-client opencv-python-headless
      - name: Training resume variant and History-only removal
        run: |
          node --check tool/js/training_review.js
          node --check tool/js/training_history_ui.js
          node --check tool/js/training_runner_ui.js
          python -m pytest -q tests/test_training_history_unlink.py tests/test_training_resume_discovery.py
          python -m pytest -q tests/test_training_history_ui_contract.py -k 'not training_history_promotes_recorded_epoch_and_step_progress and not training_history_loads_timing_for_completed_and_finished_early_rows'
      - name: QA Curate Training Set Director and selection contract
        run: |
          python -m compileall -q tool/server/qa_curation.py tool/server/llm_runner.py
          python -m pytest -q tests/test_qa_curation.py
      - name: Sight per-model and Caption Assist safe-discovery regression
        run: |
          python -m pytest -q tests/test_caption_enrichment.py tests/test_vision_schema_assist.py tests/test_vision_schema_route.py tests/test_set_scan_ui_contract.py tests/test_caption_atomic.py tests/test_caption_assist_reuse_contract.py tests/test_vl_workspace_unified.py tests/test_media_context_actions_contract.py
      - name: Set VL clone focused Python regression
        run: python -m pytest -q tests/test_set_vl_clone.py
      - name: Recovered Evaluate All behavior
        run: node --test tests/test_generations_evaluate_all.test.cjs
      - name: Recovery Python syntax and focused behavior
        run: |
          python -m compileall -q tool/server/training_runner.py tool/server/storyboard_store.py tool/server/execution_queue.py
          python -m pytest -q tests/test_training_continue_epoch_extension.py
          python -m pytest -q tests/test_execution_queue.py -k reorders_mixed_inference_client_jobs
          python -m pytest -q tests/test_inference_runner.py -k pending_generate_configuration_requires_explicit_job_detail_request
          python -m pytest -q tests/test_training_stabilization.py -k training_queue_reorder_position_preserves_nonqueued_slots
          python -m pytest -q tests/test_storyboard_store.py -k concept_restore_keeps_initial_prompt_as_fixed_baseline
      - name: Native Evaluation and no-feature-loss contracts
        run: python -m pytest -q tests/test_test_generations_unified_gallery.py tests/test_test_generations_unified_workspace.py tests/test_test_generations_revamp_parity.py tests/test_test_generations_perspective.py
      - name: Current native Test and Repeat contracts (must pass)
        run: |
          python -m pytest -q tests/test_test_generations_focused_unification.py tests/test_test_repeat.py tests/test_test_workspace_permanent_tabs.py tests/test_test_generations_revamp_parity.py
      - name: Set-wide Training Reference selections and campaign integration
        run: |
          python -m pytest -q tests/test_training_reference_selections.py tests/test_training_references_browser.py tests/test_epoch_finder_multigroup_references.py
      - name: Native Test, VL, Finder and Analytics regressions
        run: |
          python -m pytest -q tests/test_test_generations_ui_contract.py tests/test_test_generations_route.py tests/test_test_generations_ask_vl_navigation_contract.py tests/test_test_repeat.py tests/test_epoch_finder.py tests/test_epoch_finder_scaling.py tests/test_epoch_finder_multirun.py tests/test_run_analytics_next.py
          node --test tests/test_insights_sidebar_navigation.test.cjs

  caption-mismatch:
    name: Caption Assist tag mismatch hints
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Verify matched-tag hint submission
        run: |
          node --check tool/js/primer_settings.js
          node --check tool/js/item_details.js
          node --check tool/js/checklist_state.js
          node --check tool/js/media.js
          node --check tool/js/constants.js
          node --check tool/js/folder_state.js
          node --check tool/js/main.js
          node --check tool/js/smart_set.js
          node --check tool/js/ui.js
          node --check tool/js/qa_workbench.js
          node --check tool/js/media_grid_state.js
          node --check tool/js/media_grid_actions.js
          node --test tests/tag_mismatch_filter.test.cjs
          node --test tests/media_filter_efficiency.test.cjs
          node --test tests/qa_incomplete_health_retention.test.cjs
          node --test tests/caption_assist_tag_mismatch.test.cjs
      - name: Prepare isolated config
        run: cp tool/config.example.json tool/config.json
      - name: Install focused test essentials
        run: python -m pip install pytest Flask Pillow Werkzeug imageio websocket-client opencv-python-headless
      - name: Retired Incomplete filter and SuperSet compatibility
        run: python -m pytest -q tests/test_folder_state_ui_contract.py tests/test_file_ops_routes.py -k 'superset_search or incomplete_media_filter_is_retired or folder_state_reads_legacy'
      - name: Verify Director prompt and route
        run: python -m pytest -q tests/test_caption_atomic.py -k 'tag_mismatch or explicit_caption_candidate_repairs or caption_assist_corrections_make_retry'
