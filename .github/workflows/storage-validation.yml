name: CI

on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Prepare CI config
        run: |
          cp tool/config.example.json tool/config.json
          python - <<'PY'
          import json
          from pathlib import Path
          path = Path("tool/config.json")
          config = json.loads(path.read_text(encoding="utf-8"))
          config["filesystem"]["root"] = "/tmp/webcap-fs"
          config["filesystem"]["models"] = "/tmp/webcap-models"
          path.write_text(json.dumps(config, indent=2) + "\n", encoding="utf-8")
          Path("/tmp/webcap-fs").mkdir(parents=True, exist_ok=True)
          Path("/tmp/webcap-models").mkdir(parents=True, exist_ok=True)
          PY

      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install pytest
          python -m pip install -r requirements.txt

      - name: Run Python tests
        run: python -m pytest -q

      - name: Check JavaScript syntax
        run: find tool/js -type f -name '*.js' -print0 | xargs -0 -n1 node --check
