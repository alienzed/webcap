name: Storyboard scene header regression
on:
  pull_request:
    paths:
      - '.github/workflows/storyboard-header-validation.yml'
      - 'tool/css/storyboard.css'
      - 'tool/js/storyboard.js'
      - 'tool/js/director_chat.js'
      - 'tool/js/common.js'
      - 'tool/server/storyboard_workshop.py'
      - 'tests/test_storyboard_workshop.py'
      - 'tool/js/generate.js'
      - 'tool/js/session_prompt_history.js'
      - 'tool/tool.html'
      - 'tests/session_prompt_history.test.cjs'
      - 'tests/director_chat_storyboard_attachment.test.cjs'
      - 'tests/director_chat_persistence.test.cjs'
      - 'tests/test_director_chat_history.py'
      - 'tool/server/director_chat_history.py'
      - 'tool/server/studio_director.py'
      - 'tests/test_studio_director.py'
      - 'tests/studio_director_workshop.test.cjs'
      - 'tool/js/workspace_shell.js'
      - 'tool/js/diagnostics.js'
      - 'tool/server/model_lab.py'
      - 'tool/server/storyboard_llm_runtime.py'
      - 'tool/server/storyboard_llm_contract.py'
      - 'tool/server/storyboard_store.py'
      - 'tool/server/llm_runner.py'
      - 'tool/server/app.py'
      - 'tests/test_storyboard_llm_contract.py'
      - 'tests/test_storyboard_store.py'
      - 'tests/test_storyboard_route.py'
      - 'tests/test_storyboard_ui_contract.py'
      - 'tests/test_storyboard_individual_development_sequence.py'
      - 'tests/test_model_assessment_thinking_unified.py'
      - 'tests/test_storyboard_header_regression.py'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  header-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: node --check tool/js/storyboard.js && node --check tool/js/director_chat.js && node --check tool/js/diagnostics.js
      - name: Assistant conversation persistence
        run: node --test tests/director_chat_persistence.test.cjs
      - name: Studio Director Writer's Workshop
        run: |
          node --check tool/js/workspace_shell.js
          node --test tests/studio_director_workshop.test.cjs
      - name: Storyboard Chat attached context
        run: node --test tests/director_chat_storyboard_attachment.test.cjs
      - name: RAM-only instruction history
        run: |
          node --check tool/js/session_prompt_history.js
          node --check tool/js/generate.js
          node --test tests/session_prompt_history.test.cjs
      - run: cp tool/config.example.json tool/config.json
      - run: python -m pip install pytest Flask Pillow Werkzeug imageio websocket-client opencv-python-headless
      - run: python -m compileall -q tool/server
      - name: Assistant session store and Studio guidance API
        run: python -m pytest -q tests/test_director_chat_history.py tests/test_studio_director.py
      - run: node --check tool/js/model_lab.js
      - run: python -m pytest -q tests/test_storyboard_header_regression.py tests/test_director_thinking_mvp.py tests/test_model_assessment_thinking_unified.py
      - name: Atomic individual Scene development
        run: python -m pytest -q tests/test_storyboard_individual_development_sequence.py
      - name: Storyboard additive Scene regressions
        run: |
          python -m pytest -q tests/test_storyboard_llm_contract.py -k 'insert_scene or extend_story or refine_prompt or refine_scene or custom_scene'
          python -m pytest -q tests/test_storyboard_store.py -k 'insert_director_scene or extend_story'
          python -m pytest -q tests/test_storyboard_ui_contract.py -k 'can_insert_director_scene or storyboard_revise_scenes'
      - name: Storyboard Workshop bounded Apply
        run: |
          node --check tool/js/director_chat.js
          node --check tool/js/common.js
          python -m pytest -q tests/test_storyboard_workshop.py
          python -m pytest -q tests/test_storyboard_ui_contract.py -k workshop_context_opt_in
          python -m pytest -q tests/test_storyboard_route.py -k 'workshop_context_and_atomic_shot or workshop_proposal_uses_fixed'
          python -m pytest -q tests/test_storyboard_store.py -k 'story_guidelines_survive or workshop_allows_discussion'
          python -m pytest -q tests/test_storyboard_llm_contract.py -k optional_story_guidelines
      - name: Reviewed Story guideline changes
        run: |
          python -m pytest -q tests/test_storyboard_store.py tests/test_storyboard_route.py tests/test_storyboard_ui_contract.py -k 'reviewed_guidelines or chat_story_guideline_proposal or story_guidelines_use_reviewed or define_from_concept_review or storyboard_chat_preserves_inline_story_reference'
      - name: Storyboard core contracts
        run: |
          python -m pytest -q tests/test_storyboard_llm_contract.py tests/test_storyboard_workshop.py
          python -m pytest -q tests/test_storyboard_store.py -k 'story_guidelines_survive or workshop_allows_discussion'
          python -m pytest -q tests/test_storyboard_route.py -k 'workshop_context_and_atomic_shot or workshop_proposal_uses_fixed'
