name: Storyboard scene header regression
on:
  pull_request:
    paths:
      - 'tool/css/storyboard.css'
      - 'tool/js/storyboard.js'
      - 'tests/test_storyboard_header_regression.py'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  header-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: node --check tool/js/storyboard.js
      - run: cp tool/config.example.json tool/config.json
      - run: python -m pip install pytest Flask Pillow Werkzeug imageio websocket-client opencv-python-headless
      - run: python -m compileall -q tool/server
      - run: node --check tool/js/director_model_test.js
      - run: python -m pytest -q tests/test_storyboard_header_regression.py tests/test_director_thinking_mvp.py
