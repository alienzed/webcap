name: Focused Test Launch and Epoch Results
on:
  pull_request:
    paths:
      - 'tool/tool.html'
      - 'tool/js/test_generations.js'
      - 'tool/js/epoch_finder.js'
      - 'tool/js/test_references.js'
      - 'tool/css/epoch_finder.css'
      - 'tests/test_training_references_browser.py'
      - 'AGENTS.md'
      - 'tool/js/run_analytics.js'
      - 'tool/css/styles.css'
      - 'tests/test_test_generations_focused_unification.py'
      - 'tests/test_test_repeat.py'
      - 'tool/server/epoch_test_bench.py'
      - 'tool/server/llm_runner.py'
      - 'tool/js/inference_queue.js'
      - 'tool/server/inference_runtime.py'
      - 'tool/css/workspace_shell.css'
      - 'tests/inference_error_passthrough.test.cjs'
      - 'tests/test_inference_error_passthrough.py'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  parity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify JS
        run: |
          node --check tool/js/test_generations.js
          node --check tool/js/epoch_finder.js
          node --check tool/js/test_references.js
          node --check tool/js/run_analytics.js
          node --check tool/js/inference_queue.js
          node --test tests/inference_error_passthrough.test.cjs
      - name: Install tests
        run: python -m pip install pytest
      - name: Focused regression
        run: |
          python -m pytest -q tests/test_test_generations_focused_unification.py tests/test_test_repeat.py tests/test_training_references_browser.py
          cp tool/config.example.json tool/config.json
          python -m pytest -q tests/test_inference_error_passthrough.py
