name: Evaluation workspace recovery
on:
  pull_request:
    paths:
      - 'tool/js/test_generations.js'
      - 'tool/js/epoch_finder.js'
      - 'tool/js/workspace_shell.js'
      - 'tests/test_evaluation_url_history.test.cjs'
      - 'tests/test_test_surface_context_navigation.test.cjs'
      - 'tests/test_test_workspace_safe_recovery.py'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --check tool/js/test_generations.js && node --check tool/js/epoch_finder.js
      - run: node --check tool/js/workspace_shell.js && node --test tests/test_test_surface_context_navigation.test.cjs tests/test_evaluation_url_history.test.cjs
      - run: python -m pip install pytest
      - run: python -m pytest -q tests/test_test_workspace_safe_recovery.py
