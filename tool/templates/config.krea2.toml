output_dir = "{TRAINING_ROOT}/output/runs/{SET_NAME}"
dataset    = "{TRAINING_ROOT}/{DATASET}/dataset.train.toml"

epochs = 90
save_every_n_epochs = 1

micro_batch_size_per_gpu = 2
pipeline_stages = 1
gradient_accumulation_steps = 1
gradient_clipping = 1.0
warmup_steps = 100

checkpoint_every_n_epochs = 5
activation_checkpointing = true
partition_method = "parameters"
save_dtype = "bfloat16"
caching_batch_size = 4
steps_per_print = 10

# Start without block swapping on the 5090. Add 4-8 if training runs out of VRAM.
# blocks_to_swap = 4

[model]
type = "krea2"
diffusion_model = "{MODELS_ROOT}/Stable-diffusion/krea2/krea2_raw_bf16.safetensors"
vae = "{MODELS_ROOT}/vae/qwen_image_vae.safetensors"
text_encoders = [
  { path = "{MODELS_ROOT}/text_encoders/qwen3vl_4b_bf16.safetensors", type = "krea2" },
]
dtype = "bfloat16"
diffusion_model_dtype = "float8"
timestep_sample_method = "logit_normal"

[adapter]
type = "lora"
rank = 32
dropout = 0.01
dtype = "bfloat16"

[optimizer]
type = "AdamW8bitKahan"
lr = 6e-5
betas = [0.9, 0.99]
weight_decay = 0.01
eps = 1e-8
stabilize = false
