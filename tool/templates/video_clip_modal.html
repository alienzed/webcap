<div id="video-clip-modal" class="video-clip-modal hidden" aria-hidden="true">
    <div class="crop-modal-dialog video-clip-dialog">
        <div class="video-clip-topbar">
            <div class="video-clip-title-stack">
                <span class="video-clip-kicker">Video clipper</span>
                <strong id="video-clip-title">Clip video</strong>
            </div>
            <span id="video-clip-source-meta" class="video-clip-source-meta"></span>
            <button id="video-clip-cancel-x" type="button" title="Close" aria-label="Close video clip modal">x</button>
        </div>

        <div class="video-clip-workspace">
            <div class="video-clip-stage-panel">
                <div id="video-clip-player-wrap" class="video-clip-player-wrap">
                    <div id="video-clip-preview-stage" class="video-clip-preview-stage">
                        <video
                            id="video-clip-video"
                            controls
                            playsinline
                            preload="metadata"
                        ></video>
                        <img id="video-clip-exact-frame-preview" class="video-clip-exact-frame-preview hidden" alt="Exact decoded video frame preview">
                        <div id="video-clip-exact-frame-note" class="video-clip-exact-frame-note hidden" aria-live="polite"></div>
                        <div id="video-clip-crop-edit-layer" class="video-clip-crop-edit-layer hidden" aria-hidden="true">
                            <img id="video-clip-crop-edit-image" alt="Video crop edit frame">
                        </div>
                        <div id="video-clip-crop-overlay" class="video-clip-crop-overlay hidden" aria-hidden="true">
                            <span class="video-clip-crop-overlay-label">Crop</span>
                        </div>
                    </div>
                </div>
                <div class="video-clip-transport-row">
                    <div class="video-clip-transport-controls">
                        <button id="video-clip-skip-back-btn" type="button" class="video-clip-inline-btn">-5s</button>
                        <button id="video-clip-exact-back-btn" type="button" class="video-clip-inline-btn" title="Previous decoded frame">◀ 1f</button>
                        <button id="video-clip-exact-forward-btn" type="button" class="video-clip-inline-btn" title="Next decoded frame">1f ▶</button>
                        <button id="video-clip-skip-forward-btn" type="button" class="video-clip-inline-btn">+5s</button>
                        <span class="video-clip-transport-separator" aria-hidden="true"></span>
                        <label for="video-clip-rate-select" class="video-clip-accessible-label">Speed</label>
                        <select id="video-clip-rate-select" class="video-clip-rate-select" aria-label="Playback speed">
                            <option value="1">Speed 1x</option>
                            <option value="2">Speed 2x</option>
                            <option value="4">Speed 4x</option>
                            <option value="8">Speed 8x</option>
                        </select>
                        <button id="video-clip-loop-preview-btn" type="button" class="video-clip-inline-btn">Loop</button>
                    </div>
                </div>
                <div class="video-clip-timeline">
                    <div class="video-clip-timeline-track">
                        <div id="video-clip-selection-range" class="video-clip-selection-range">
                            <span class="video-clip-range-handle video-clip-range-handle--start" data-video-clip-range-handle="start"></span>
                            <span class="video-clip-range-handle video-clip-range-handle--end" data-video-clip-range-handle="end"></span>
                        </div>
                        <div id="video-clip-playhead" class="video-clip-playhead"></div>
                    </div>
                    <div class="video-clip-timeline-labels" aria-live="polite">
                        <span id="video-clip-timeline-start-label">Start 0.000s</span>
                        <span id="video-clip-timeline-end-label">End 2.000s</span>
                    </div>
                    <div class="video-clip-timeline-ticks">
                        <span></span>
                        <span></span>
                        <span></span>
                        <span></span>
                        <span></span>
                    </div>
                </div>
            </div>

            <div class="video-clip-settings-panel">
                <div class="video-clip-setting-group">
                    <div class="video-clip-form-label">Current Frame</div>
                    <div id="video-clip-current-frame-status" class="video-clip-section-note">No exact frame selected.</div>
                    <div class="video-clip-frame-actions">
                        <button id="video-clip-preview-frame-btn" type="button" class="video-clip-inline-btn">Preview Frame</button>
                        <button id="video-clip-extract-frame-btn" type="button" class="video-clip-inline-btn" disabled>Extract Frame…</button>
                    </div>
                    <div id="video-clip-extract-frame-confirm" class="video-clip-extract-frame-confirm hidden">
                        <label for="video-clip-extract-name-input" class="video-clip-field-label">Frame filename</label>
                        <input id="video-clip-extract-name-input" type="text" value="">
                        <div class="video-clip-frame-actions">
                            <button id="video-clip-extract-save-btn" type="button" class="video-clip-inline-btn">Add to Set</button>
                            <button id="video-clip-extract-cancel-btn" type="button" class="video-clip-inline-btn">Cancel</button>
                        </div>
                    </div>
                </div>
                <div class="video-clip-setting-group">
                    <div class="video-clip-form-label">Trim</div>
                    <div class="video-clip-trim-grid">
                        <div>
                            <label for="video-clip-start-input" class="video-clip-field-label">Start</label>
                            <input
                                id="video-clip-start-input"
                                type="number"
                                step="0.001"
                                min="0"
                                value="0"
                            >
                        </div>
                        <div>
                            <label for="video-clip-end-input" class="video-clip-field-label">End</label>
                            <input
                                id="video-clip-end-input"
                                type="number"
                                step="0.001"
                                min="0"
                                value="2.0"
                            >
                        </div>
                        <div>
                            <label for="video-clip-duration-input" class="video-clip-field-label">Duration</label>
                            <input
                                id="video-clip-duration-input"
                                type="number"
                                step="0.001"
                                min="0.1"
                                value="2.0"
                            >
                        </div>
                    </div>
                    <div class="video-clip-trim-actions">
                        <button id="video-clip-mark-start-btn" type="button" class="video-clip-inline-btn video-clip-mark-btn">Mark Start</button>
                        <button id="video-clip-mark-end-btn" type="button" class="video-clip-inline-btn video-clip-mark-btn">Mark End</button>
                    </div>
                </div>

                <div class="video-clip-setting-group">
                    <div class="video-clip-form-label">Crop Ratio</div>
                    <div id="video-clip-crop-summary" class="video-clip-section-note hidden"></div>
                    <div class="video-clip-ratio-row" role="group" aria-label="Crop aspect ratio">
                        <button type="button" class="video-clip-ratio-btn active" data-ratio="1">1:1</button>
                        <button type="button" class="video-clip-ratio-btn" data-ratio="1.3333333333">4:3</button>
                        <button type="button" class="video-clip-ratio-btn" data-ratio="0.5625">9:16</button>
                        <button type="button" class="video-clip-ratio-btn" data-ratio="1.7777778">16:9</button>
                    </div>
                    <div class="video-clip-crop-actions">
                        <button id="video-clip-crop-apply-btn" type="button" class="video-clip-inline-btn hidden">Apply Crop</button>
                        <button id="video-clip-crop-cancel-btn" type="button" class="video-clip-inline-btn hidden">Cancel</button>
                        <span id="video-clip-size-readout" class="video-clip-size-readout">Full frame</span>
                    </div>
                </div>

                <div class="video-clip-setting-group">
                    <label for="video-clip-output-input" class="video-clip-form-label">Output</label>
                    <input id="video-clip-output-input" type="text" value="">
                    <div id="video-clip-export-state-note" class="video-clip-section-note hidden"></div>
                </div>

                <div class="video-clip-controls-group">
                    <button id="video-clip-export-btn" type="button">Export</button>
                    <button id="video-clip-cancel-btn" type="button">Cancel</button>
                </div>
            </div>
        </div>
        <div id="video-clip-status" class="crop-status video-clip-status hidden" aria-live="polite" aria-busy="false">
            <span class="video-clip-status-indicator" aria-hidden="true"></span>
            <span id="video-clip-status-text"></span>
        </div>

    </div>
</div>
